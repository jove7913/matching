<style>
:root{
  --bg:#eceeea; --surface:#fbfcfa; --sunk:#e3e6e1; --ink:#18212b; --muted:#5a6772; --line:#cfd5ce;
  --accent:#0b5cad; --accent-ink:#ffffff; --accent-soft:#dbe9f7;
  --p1-bg:#fae6c8; --p1-ink:#7a4100; --p2-bg:#d2ede6; --p2-ink:#075a50;
  --ok:#1b7440; --ok-bg:#dcf0e2; --bad:#b3261e; --bad-bg:#f8dedb;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#11161b; --surface:#1a2128; --sunk:#232c35; --ink:#e7ecef; --muted:#9aa7b1; --line:#303b46;
    --accent:#74b4f6; --accent-ink:#0a1520; --accent-soft:#1d3349;
    --p1-bg:#4a3310; --p1-ink:#f6cf8e; --p2-bg:#113f39; --p2-ink:#93dccf;
    --ok:#7fd49c; --ok-bg:#173825; --bad:#f29a93; --bad-bg:#472220;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
nav a,.lang button{font:inherit;font-weight:600;font-size:14px;padding:7px 14px;border-radius:7px;border:0;background:transparent;color:var(--muted);text-decoration:none;cursor:pointer}
nav a.on,.lang button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lang{display:flex;gap:2px;background:var(--sunk);padding:4px;border-radius:10px}
.lang button{padding:7px 10px;font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
.sync{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.col{display:flex;flex-direction:column;gap:16px}
.scanrow{display:flex;gap:8px;flex-wrap:wrap}
.scanrow input[type=text]{flex:1 1 260px;min-width:0;font-family:var(--f-mono);font-size:19px;font-weight:500;padding:13px 14px;border-radius:9px;border:2px solid var(--accent);background:var(--bg);color:var(--ink)}
input,select,button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font-weight:600;font-size:14px;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:7px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
#cam video{width:100%;max-height:50vh;border-radius:10px;background:#000}
.result{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.how{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.pn{border-radius:10px;padding:12px 14px;background:var(--sunk);display:flex;flex-direction:column;gap:4px;min-width:0}
.pn.answer{background:var(--accent);color:var(--accent-ink)}
.pn .lbl{font-size:12px;font-weight:600;opacity:.85;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pn .val{font-family:var(--f-mono);font-size:clamp(20px,4.6vw,30px);font-weight:600;overflow-wrap:anywhere;line-height:1.2}
.pn button{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.9}
.arrow{align-self:center;font-size:22px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.meta div{display:flex;flex-direction:column;gap:2px}
.k{font-size:12px;color:var(--muted);font-weight:600}
.meta .v{font-size:16px;font-weight:600}
.plant{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;margin-right:4px}
.plant.p1{background:var(--p1-bg);color:var(--p1-ink)}
.plant.p2{background:var(--p2-bg);color:var(--p2-ink)}
.empty{border:2px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.empty b{font-family:var(--f-mono);overflow-wrap:anywhere}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--accent-soft)}
h2{font-size:14px;font-weight:700;margin:0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input[type=text],.bar input[type=password]{flex:1 1 160px;min-width:0;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.form input[type=text]{padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
.checks{display:flex;flex-wrap:wrap;gap:14px;font-size:14px;color:var(--ink);font-weight:500;padding:8px 0}
.msg{font-size:13px;font-weight:600}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
[hidden]{display:none!important}
@media (max-width:560px){
  .pair{grid-template-columns:1fr}
  .arrow{transform:rotate(90deg);justify-self:center}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i="title"></h1>
      <div class="sub" data-i="subtitle"></div>
    </div>
    <div class="tools">
      <nav>
        <a href="#lookup" id="tab-lookup" data-i="tabLookup"></a>
        <a href="#master" id="tab-master" data-i="tabMaster"></a>
      </nav>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-ko">한국어</button>
        <button type="button" id="lang-es">Español</button>
      </div>
    </div>
  </header>

  <div class="banner" id="demo-banner" data-i="demoBanner" hidden></div>
  <div class="sync">
    <span id="sync-text"></span>
    <button class="btn small" type="button" id="btn-refresh" data-i="btnRefresh"></button>
  </div>

  <!-- 조회 -->
  <section id="view-lookup" class="col">
    <form class="panel" id="scan-form" autocomplete="off">
      <div class="scanrow">
        <input type="text" id="q" autocapitalize="characters" spellcheck="false" aria-label="scan">
        <button class="btn primary" type="submit" data-i="btnLookup"></button>
        <button class="btn" type="button" id="btn-cam" data-i="btnCam"></button>
        <label class="btn" for="photo" data-i="btnPhoto"></label>
        <input type="file" id="photo" accept="image/*" capture="environment" hidden>
      </div>
      <div class="hint" data-i="scanHint"></div>
      <div class="chips" id="sample-row" hidden>
        <span class="k" data-i="tryLabel"></span>
        <span id="samples" class="chips"></span>
      </div>
      <div id="cam" hidden class="col" style="gap:8px">
        <video id="video" playsinline muted></video>
        <div><button class="btn small" type="button" id="cam-stop" data-i="btnCamStop"></button></div>
      </div>
      <div class="msg bad" id="scan-msg" hidden></div>
    </form>

    <div class="result" id="result"></div>

    <div class="panel">
      <h2 data-i="history"></h2>
      <div class="tblwrap"><table id="hist"></table></div>
    </div>
  </section>

  <!-- 마스터 -->
  <section id="view-master" class="col" hidden>
    <form class="panel" id="lock-form" autocomplete="off">
      <h2 data-i="lockTitle"></h2>
      <div class="bar">
        <input type="password" id="pin" inputmode="numeric" autocomplete="off" aria-label="PIN">
        <button class="btn primary" type="submit" data-i="btnUnlock"></button>
      </div>
      <div class="hint" data-i="lockHint"></div>
      <div class="msg bad" id="lock-msg" hidden></div>
    </form>

    <div class="panel" id="admin-panel" hidden>
      <div class="bar">
        <label class="btn primary" for="xlsx" data-i="btnUpload"></label>
        <input type="file" id="xlsx" accept=".xlsx,.xls,.csv" hidden>
        <button class="btn" type="button" id="btn-add" data-i="btnAdd"></button>
        <button class="btn" type="button" id="btn-template" data-i="btnTemplate"></button>
        <button class="btn" type="button" id="btn-export" data-i="btnExport"></button>
        <button class="btn" type="button" id="btn-lock" data-i="btnLock"></button>
      </div>
      <div class="hint" data-i="uploadHint"></div>
      <div id="import-bar" hidden class="col" style="gap:8px">
        <span class="msg ok" id="import-msg"></span>
        <div class="checks">
          <label><input type="radio" name="imode" id="imode-merge" checked> <span data-i="modeMerge"></span></label>
          <label><input type="radio" name="imode" id="imode-replace"> <span data-i="modeReplace"></span></label>
        </div>
        <div class="bar">
          <button class="btn primary small" type="button" id="import-apply" data-i="btnApply"></button>
          <button class="btn small" type="button" id="import-cancel" data-i="btnCancel"></button>
        </div>
      </div>
      <form class="bar" id="pin-form" autocomplete="off">
        <input type="password" id="newpin" inputmode="numeric" autocomplete="off" aria-label="new PIN">
        <button class="btn small" type="submit" data-i="btnPin"></button>
      </form>
      <div class="msg" id="master-msg" hidden></div>
    </div>

    <form class="panel" id="edit-form" hidden autocomplete="off">
      <h2 id="edit-title"></h2>
      <div class="form">
        <label><span data-i="colNifco"></span><input type="text" id="f-nifco"></label>
        <label><span data-i="colCust"></span><input type="text" id="f-cust"></label>
        <label><span data-i="colModel"></span><input type="text" id="f-model"></label>
        <label><span data-i="colName"></span><input type="text" id="f-name"></label>
        <div>
          <div class="k" data-i="colPlant"></div>
          <div class="checks">
            <label><input type="checkbox" id="f-p1"> <span data-i="plant1"></span></label>
            <label><input type="checkbox" id="f-p2"> <span data-i="plant2"></span></label>
          </div>
        </div>
      </div>
      <div class="bar">
        <button class="btn primary" type="submit" data-i="btnSave"></button>
        <button class="btn" type="button" id="edit-cancel" data-i="btnCancel"></button>
        <span class="msg bad" id="edit-msg"></span>
      </div>
    </form>

    <div class="bar"><input type="text" id="mfilter" aria-label="filter" style="background:var(--surface)"></div>
    <div class="hint" id="mcount"></div>
    <div class="tblwrap"><table id="mtable"></table></div>
  </section>
</div>

function api(path, opt){

  if(opt.headers) Object.assign(h, opt.headers);
  return fetch(CFG.url.replace(/\/+$/,"")+"/rest/v1/"+path, {method:opt.method||"GET", headers:h, body:opt.body?JSON.stringify(opt.body):undefined})

    .then(function(r){
      if(r.ok) return r.text().then(function(x){ return x ? JSON.parse(x) : null; });
      return r.text().then(function(x){ var m = ""; try{ m = JSON.parse(x).message || ""; }catch(e){} throw new Error(m || ("HTTP "+r.status)); });

/* ---------- 판독 로직 ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function key(s){ return String(s==null?"":s).toUpperCase().replace(/[\s\-_.\/]/g,""); }
function byNifco(v){ var k=key(v); return master.filter(function(r){return key(r.nifco)===k;}); }
function byCust(v){ var k=key(v); return master.filter(function(r){return key(r.cust)===k;}); }

function resolve(raw){
  var typed = String(raw||"").trim().toUpperCase();
  if(!typed) return null;
  // 스페인어 자판: 스캐너가 ^ 를 & 로, - 를 ' 로 입력하는 경우 보정
  var src = typed.replace(/&/g,"^").replace(/'/g,"-");
  var o = {raw:src, fixed:src!==typed, kind:"manual", by:null, fields:{}, matches:[], pair:null};

  if(src.indexOf("^")>=0){
    src.split("^").forEach(function(tok){
      var m = tok.match(/^(I1|I2|L1|Q1|C5|H1)(.+)$/);
      if(m) o.fields[m[1]] = m[2].trim();
    });
    if(o.fields.I1 || o.fields.I2){
      o.kind = "label";
      if(o.fields.I1){ o.matches = byNifco(o.fields.I1); o.by="nifco"; o.input=o.fields.I1; }
      if(!o.matches.length && o.fields.I2){ o.matches = byCust(o.fields.I2); o.by="cust"; o.input=o.fields.I2; }
      if(o.matches.length && o.fields.I1 && o.fields.I2){
        o.pair = o.matches.some(function(r){ return key(r.nifco)===key(o.fields.I1) && key(r.cust)===key(o.fields.I2); });
      }
      if(!o.input) o.input = o.fields.I1 || o.fields.I2;
      return o;
    }
  }
  if(/^M8/.test(src) && byNifco(src.slice(2)).length){
    o.kind="product"; o.by="nifco"; o.input=src.slice(2); o.matches=byNifco(o.input); return o;
  }
  o.input = src;
  var m1 = byNifco(src); if(m1.length){ o.by="nifco"; o.matches=m1; return o; }
  var m2 = byCust(src);  if(m2.length){ o.by="cust";  o.matches=m2; return o; }
  // 긴 바코드 안에 품번이 들어 있는 경우
  var k = key(src);
  var inside = master.filter(function(r){ return key(r.nifco).length>=6 && k.indexOf(key(r.nifco))>=0; });
  if(inside.length){ o.kind="barcode"; o.by="nifco"; o.matches=inside; return o; }
  inside = master.filter(function(r){ return key(r.cust).length>=6 && k.indexOf(key(r.cust))>=0; });
  if(inside.length){ o.kind="barcode"; o.by="cust"; o.matches=inside; return o; }
  // 부분 검색
  if(k.length>=2 && src.indexOf("^")<0){
    var part = master.filter(function(r){ return key(r.nifco).indexOf(k)>=0 || key(r.cust).indexOf(k)>=0; });
    if(part.length){ o.kind="partial"; o.matches=part.slice(0,100); return o; }
  }
  return o;
}

function renderResult(o){

    ? createImageBitmap(file).then(function(bmp){ return new window.BarcodeDetector().detect(bmp); })
        .then(function(r){ if(r && r.length) return r[0].rawValue; throw new Error("none"); })
    : Promise.reject(new Error("no detector"));
  return native.catch(function(){
    if(!window.ZXing) throw new Error("no reader");
    return new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url).then(function(r){ return r.getText(); });
  }).finally(function(){ setTimeout(function(){ URL.revokeObjectURL(url); }, 2000); });
}

      + (pin ? '<td><button class="btn small" type="button" data-edit="'+esc(r.id)+'">'+esc(t("edit"))+'</button> <button class="btn small" type="button" data-del="'+esc(r.id)+'">'+esc(t("del"))+'</button></td>' : '')
      + '</tr>';
  });
  $("mtable").innerHTML = h;
  $("mcount").textContent = t("count")(total, master.length) + (total>shown ? t("more")(shown) : "");
}

           plant:[$("f-p1").checked?"1":"", $("f-p2").checked?"2":""].filter(Boolean).join(",")};
  if(!r.nifco || !r.cust){ $("edit-msg").textContent = t("errRequired"); return; }
  var dup = master.find(function(x){ return key(x.nifco)===key(r.nifco) && key(x.cust)===key(r.cust); });
  if(dup && (!editing || dup.id!==editing.id)){ $("edit-msg").textContent = t("errDup"); return; }
  $("edit-msg").textContent = t("saving");
  var job = editing ? store.update(pin, editing.id, r) : store.save(pin, [r], false);
  job.then(function(){ $("edit-form").hidden = true; return reload(); }).catch(function(err){ $("edit-msg").textContent = errText(err); });
});

/* 엑셀 업로드 / 내려받기 */
var HEAD = {
  nifco:/nifco|내부|자사|사내|interno/i, cust:/고객|customer|cliente|mobis/i,
  model:/차종|model|vehic|proyecto/i, name:/품명|name|desc|nombre/i, plant:/양산|공장|plant|planta|생산처/i
};
function plantOf(v){ var s = String(v==null?"":v), o = []; if(/1/.test(s)) o.push("1"); if(/2/.test(s)) o.push("2"); return o.join(","); }
$("xlsx").addEventListener("change", function(){
  var file = this.files && this.files[0]; this.value = "";
  if(!file) return;
  var rd = new FileReader();
  rd.onload = function(){
    var rows = [];
    try{
      var wb = XLSX.read(new Uint8Array(rd.result), {type:"array"});
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:"", raw:false});
    }catch(err){ rows = []; }
    var map = {nifco:0,cust:1,model:2,name:3,plant:4}, start = 0;
    for(var i=0;i<Math.min(rows.length,10);i++){
      var found = {};
      rows[i].forEach(function(c,ci){ Object.keys(HEAD).forEach(function(k){ if(found[k]==null && HEAD[k].test(String(c))) found[k]=ci; }); });
      if(found.nifco!=null && found.cust!=null && found.nifco!==found.cust){ map = Object.assign({model:-1,name:-1,plant:-1}, found); start = i+1; break; }
    }
    var list = [], skipped = 0, seen = {};
    rows.slice(start).forEach(function(r){
      var g = function(k){ return map[k]>=0 && r[map[k]]!=null ? String(r[map[k]]).trim() : ""; };
      var rec = {nifco:g("nifco").toUpperCase(), cust:g("cust").toUpperCase(), model:g("model"), name:g("name"), plant:plantOf(g("plant"))};
      if(!rec.nifco && !rec.cust && !rec.model && !rec.name) return;
      if(!rec.nifco || !rec.cust){ skipped++; return; }
      var kk = key(rec.nifco)+"|"+key(rec.cust); if(seen[kk]) return; seen[kk] = 1;
      list.push(rec);
    });
    if(!list.length){ masterMsg(t("importNone"), true); $("import-bar").hidden = true; return; }
    var nu = 0, up = 0;
    list.forEach(function(r){ if(master.some(function(x){ return key(x.nifco)===key(r.nifco) && key(x.cust)===key(r.cust); })) up++; else nu++; });
    pending = list; masterMsg("");
    $("imode-merge").checked = true;
    $("import-msg").textContent = file.name+" · "+list.length+" · "+t("importMsg")(nu,up,skipped);
    $("import-bar").hidden = false;
  };
  rd.readAsArrayBuffer(file);
});
$("import-apply").addEventListener("click", function(){
  if(!pending) return;
  var btn = this; btn.disabled = true; masterMsg(t("saving"));
  store.save(pin, pending, $("imode-replace").checked).then(function(){
    pending = null; $("import-bar").hidden = true; return reload();
  }).then(function(){ masterMsg(t("importDone")); })
    .catch(function(err){ masterMsg(errText(err), true); })
    .then(function(){ btn.disabled = false; });
});
$("import-cancel").addEventListener("click", function(){ pending = null; $("import-bar").hidden = true; });
var XHEAD = ["내부품번","고객사품번","차종","품명","양산처"];
function writeXlsx(rows, fname){
  var ws = XLSX.utils.aoa_to_sheet([XHEAD].concat(rows));
  ws["!cols"] = [{wch:16},{wch:16},{wch:12},{wch:30},{wch:8}];
  var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "master");
  XLSX.writeFile(wb, fname);
}
$("btn-template").addEventListener("click", function(){ writeXlsx([["BR02DA00104","865A7-R5JA0","차종","품명","2"]], "pn_master_template.xlsx"); });
$("btn-export").addEventListener("click", function(){
  writeXlsx(master.map(function(r){ return [r.nifco, r.cust, r.model, r.name, r.plant]; }), "pn_master_"+new Date().toISOString().slice(0,10)+".xlsx");
});

}
